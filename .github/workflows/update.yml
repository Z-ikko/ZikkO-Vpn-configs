name: Update ZikkO Vpn configs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: zikko-sub-publish
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip --disable-pip-version-check install --no-index --only-binary=:all: --find-links wheels --require-hashes -r requirements.txt
      - run: python -m unittest -v
      - run: python collector.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_OWN_PEER: ${{ secrets.TG_OWN_PEER }}
      - name: Publish complete snapshot
        run: |
          git add -- sub
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update ZikkO Vpn configs'
          git push origin HEAD:main
